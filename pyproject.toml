[project]
name = "quinn-video"
version = "0.1.0"
description = "Topic to finished short-form educational video: HeyGen avatar, synced VO, word-by-word captions, on-topic b-roll."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pillow>=10.3",
    "pydantic>=2.7",
]

[project.scripts]
quinn-video = "quinnvideo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quinnvideo"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# There is no single blessed ruff config. Astral ships a deliberately minimal
# default (E4, E7, E9, F) and every serious project curates upward from there.
# Checked against pydantic, fastapi and httpx: all three select rather than
# extend-select, and none go anywhere near ALL.
select = [
    # The core those three agree on.
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # import order
    "B",     # bugbear: real bug shapes, mutable defaults and the like
    "UP",    # syntax that a newer Python does better
    "C4",    # comprehensions
    "PIE",   # small correctness and clarity misc
    # Beyond the consensus, each earning its place here.
    "SIM",   # simplifications
    "RUF",   # ruff's own checks
    "PERF",  # obvious performance traps
    "RET",   # return-statement shape
    "FURB",  # more idiomatic modern Python
    "ARG",   # dead parameters, which are usually a refactor left half-done
    "S101",  # asserts vanish under -O; raise something real instead
    "PYI",   # context managers should return Self
    "PT",    # pytest style
    "TRY",   # exception handling shape
    "N",     # naming
]
ignore = [
    # Network and codec fallbacks catch broadly on purpose: a thumbnail that
    # will not download must degrade, not abort a paid render.
    "BLE001",
    # NOTE on E501, which pydantic and fastapi both disable and we keep.
    # Their reasoning is sound -- the formatter owns line length, and it only
    # makes a best-effort attempt, so E501 fires on things it cannot fix. But
    # what it cannot fix here is comments, and the comments in this codebase
    # are doing real work: they carry the reasoning behind decisions that look
    # arbitrary. E501 is the only thing keeping them wrapped, so it stays.
    # Long messages inside raise() are the point -- these tell the operator
    # exactly what to change, and hoisting them to variables hurts reading.
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert; that is what tests do.
"tests/*" = ["S101", "PT018"]

[dependency-groups]
dev = ["pytest>=8.0"]
