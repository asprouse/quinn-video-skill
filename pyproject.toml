[project]
name = "quinn-video"
version = "0.1.0"
description = "Topic to finished short-form educational video: HeyGen avatar, synced VO, word-by-word captions, on-topic b-roll."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pillow>=10.3",
    "pydantic>=2.7",
]

[project.scripts]
quinn-video = "quinnvideo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quinnvideo"]

[tool.ruff]
line-length = 100
target-version = "py311"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
